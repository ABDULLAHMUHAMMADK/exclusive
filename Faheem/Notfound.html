<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        .second-div {
            box-shadow: rgba(0, 0, 0, 0.15) 1.95px 1.95px 2.6px;
        }

        #header select {
            background-color: #000000;
            color: #ffffff;
            border: 0;
            outline: none;
        }

        #header select option {
            background-color: #ffffff;
            color: #000000;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdn.tailwindcss.com"></script>
    

</head>

<body class="bg-white min-h-screen flex flex-col">
    <div id="header"></div>


    <section class="flex-1 flex flex-col">
        <div class="border-b border-gray-100"></div>

        <div class="max-w-7xl mx-auto w-full px-6 sm:px-10 pt-6">
            <div class="text-sm mt-7">
                <span class="text-gray-400">Home</span>
                <span class="text-gray-300 mx-2">/</span>
                <span class="text-gray-900">404 Error</span>
            </div>
        </div>

        <div class="flex-1 min-h-[520px] sm:min-h-[600px] flex flex-col items-center justify-center px-6 text-center pb-24">
            <h1 class="font-inter font-[500] text-black leading-none tracking-tight
                 text-[3.25rem] sm:text-[5.5rem] md:text-[7rem] lg:text-[8rem]">
                404 Not Found
            </h1>

            <p class="mt-7 text-gray-600 text-[15px] sm:text-base">
                Your visited page not found. You may go home page.
            </p>

            <a href="#" class="mt-8 inline-block bg-[#DB4444] hover:bg-[#d1483e] transition-colors
                text-white font-semibold text-sm
                px-7 py-3 rounded-md">
                Back to home page
            </a>
        </div>
        <div id="footer"></div>
    </section>

    <script>
        fetch("../header.html")
            .then((response) => response.text())
            .then((data) => {
                document.getElementById("header").innerHTML = data;
            })
            .catch((error) => console.error("Error loading header:", error));

        fetch("../footer.html")
            .then((response) => response.text())
            .then((data) => {
                document.getElementById("footer").innerHTML = data
                    .replaceAll("./assets/", "../assets/")
                    .replace("sm:border-2", "");
            })
            .catch((error) => console.error("Error loading footer:", error));

    </script>

</body>

</html>
