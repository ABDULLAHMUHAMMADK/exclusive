<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <title>Checkout | Exclusive</title>
    <style>
      * {
        font-family: sans-serif;
      }
      .second-div {
        box-shadow: rgba(0, 0, 0, 0.15) 1.95px 1.95px 2.6px;
      }
    </style>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body class="min-h-screen bg-white font-['DM_Sans'] text-[#171717]">
    <div id="header"></div>
    <main
      class="mx-auto max-w-[1100px] px-5 pb-20 pt-10 sm:px-8 lg:px-10 lg:pt-16"
    >
      <div class="mb-8 text-sm text-[#7d8790]">
        <a href="#" class="hover:text-[#171717]">Home</a>
        <span class="mx-3 text-[#b6bdc4]">/</span>
        <span class="text-[#171717]">Checkout</span>
      </div>

      <h1
        class="mb-5 font-['Space_Grotesk'] text-3xl font-medium text-[#082b52] sm:text-4xl"
      >
        Billing Details
      </h1>

      <form
        class="grid items-start gap-12 lg:grid-cols-[minmax(0,1fr)_470px] lg:gap-20"
      >
        <section class="space-y-4">
          <label class="block">
            <span class="mb-2 block text-sm text-[#606a73]"
              >First Name<span class="text-[#DB4444]">*</span></span
            >
            <input
              type="text"
              required
              class="border border-[#c9cbcc] h-12 w-full rounded bg-[#f5f5f5] px-4 text-sm outline-none"
            />
          </label>
          <label class="block">
            <span class="mb-2 block text-sm text-[#606a73]">Company Name</span>
            <input
              type="text"
              class="border border-[#c9cbcc] h-12 w-full rounded bg-[#f5f5f5] px-4 text-sm outline-none"
            />
          </label>
          <label class="block">
            <span class="mb-2 block text-sm text-[#606a73]"
              >Street Address<span class="text-[#DB4444]">*</span></span
            >
            <input
              type="text"
              required
              class="border border-[#c9cbcc] h-12 w-full rounded bg-[#f5f5f5] px-4 text-sm outline-none"
            />
          </label>
          <label class="block">
            <span class="mb-2 block text-sm text-[#606a73]"
              >Apartment, floor, etc. (optional)</span
            >
            <input
              type="text"
              class="border border-[#c9cbcc] h-12 w-full rounded bg-[#f5f5f5] px-4 text-sm outline-none"
            />
          </label>
          <label class="block">
            <span class="mb-2 block text-sm text-[#606a73]"
              >Town/City<span class="text-[#DB4444]">*</span></span
            >
            <input
              type="text"
              required
              class="border border-[#c9cbcc] h-12 w-full rounded bg-[#f5f5f5] px-4 text-sm outline-none"
            />
          </label>
          <label class="block">
            <span class="mb-2 block text-sm text-[#606a73]"
              >Phone Number<span class="text-[#DB4444]">*</span></span
            >
            <input
              type="tel"
              required
              class="border border-[#c9cbcc] h-12 w-full rounded bg-[#f5f5f5] px-4 text-sm outline-none"
            />
          </label>
          <label class="block">
            <span class="mb-2 block text-sm text-[#606a73]"
              >Email Address<span class="text-[#DB4444]">*</span></span
            >
            <input
              type="email"
              required
              class="border border-[#c9cbcc] h-12 w-full rounded bg-[#f5f5f5] px-4 text-sm outline-none"
            />
          </label>
          <label class="flex items-center gap-3 pt-1 text-sm text-[#171717]">
            <input type="checkbox" class="h-4 w-4 accent-[#DB4444]" />
            Save this information for faster check-out next time
          </label>
        </section>

        <section aria-label="Order summary" class="pt-1">
          <div class="space-y-5 border-b border-[#dfe3e7] pb-6">
            <div class="flex items-center justify-between gap-4">
              <div class="flex items-center gap-4">
                <div
                  class="flex h-12 w-12 items-center justify-center rounded bg-[#f3f3f3]"
                >
                  <img
                    src="image/king.png"
                    alt="LCD Monitor"
                    class="h-10 w-10 object-contain"
                  />
                </div>
                <span class="text-sm">LCD Monitor</span>
              </div>
              <span class="text-sm">$650</span>
            </div>
            <div class="flex items-center justify-between gap-4">
              <div class="flex items-center gap-4">
                <div
                  class="flex h-12 w-12 items-center justify-center rounded bg-[#f3f3f3]"
                >
                  <img
                    src="image/game.png"
                    alt="H1 Gamepad"
                    class="h-10 w-10 object-contain"
                  />
                </div>
                <span class="text-sm">H1 Gamepad</span>
              </div>
              <span class="text-sm">$1100</span>
            </div>
          </div>
          <div class="space-y-4 border-b border-[#dfe3e7] py-5 text-sm">
            <div class="flex justify-between">
              <span>Subtotal:</span><span>$1750</span>
            </div>
            <div class="flex justify-between">
              <span>Shipping:</span><span>Free</span>
            </div>
          </div>
          <div class="flex justify-between py-5 text-sm font-semibold">
            <span>Total:</span><span>$1750</span>
          </div>

          <div class="space-y-4 text-sm">
            <legend class="sr-only">Payment method</legend>
            <label class="flex items-center justify-between gap-4">
              <span class="flex items-center gap-3"
                ><input
                  type="radio"
                  name="payment"
                  checked
                  class="h-4 w-4 accent-[#DB4444]"
                />
                Bank</span
              >
              <span class="flex items-center gap-2">
                <img
                  src="image/visa.png"
                  alt="Visa"
                  class="h-5 w-9 object-contain"
                />
                <img
                  src="image/mastercard.png"
                  alt="Mastercard"
                  class="h-5 w-9 object-contain"
                />
                <img
                  src="image/b.png"
                  alt="bKash"
                  class="h-5 w-9 object-contain"
                />
                <img
                  src="image/hindi.png"
                  alt="Local payment"
                  class="h-5 w-9 object-contain"
                />
              </span>
            </label>
            <label class="flex items-center gap-3"
              ><input
                type="radio"
                name="payment"
                class="h-4 w-4 accent-[#DB4444]"
              />
              Cash on delivery</label
            >
          </div>

          <div class="mt-7 flex w-full">
            <input
              type="text"
              placeholder="Coupon Code"
              class="h-12 min-w-0 flex-1 rounded-l border border-[#9aaabd] px-4 text-sm outline-none placeholder:text-[#8694a4] focus:border-[#DB4444]"
            />
            <button
              type="button"
              class="h-12 rounded-r bg-[#DB4444] px-6 text-sm font-medium text-white transition hover:bg-[#b93636]"
            >
              Apply Coupon
            </button>
          </div>
          <button
            type="submit"
            class="mt-6 rounded bg-[#DB4444] px-10 py-4 text-sm font-medium text-white transition hover:bg-[#b93636]"
          >
            Place Order
          </button>
        </section>
      </form>
    </main>

    <!-- abdullah -->
    <div id="footer"></div>
    <script>
      fetch("../Abdullah/header.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("header").innerHTML = data;
        })
        .catch((error) => console.error("Error loading header:", error));

      fetch("../Abdullah/footer.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("footer").innerHTML = data.replaceAll(
            "./assets/",
            "../Abdullah/assets/",
          );
        })
        .catch((error) => console.error("Error loading footer:", error));
    </script>
  </body>
</html>
