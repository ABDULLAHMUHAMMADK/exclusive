<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart | Exclusive</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      * {
        font-family: sans-serif;
      }
      .second-div {
        box-shadow: rgba(0, 0, 0, 0.15) 1.95px 1.95px 2.6px;
      }
    </style>
  </head>
  <body class="min-h-screen bg-white font-['DM_Sans'] text-[#171717]">
    <div id="header"></div>
    <main
      class="mx-auto max-w-[1100px] px-3 pb-20 pt-10 sm:px-8 lg:px-10 lg:pt-16"
    >
      <section class="text-[#082b52]">
        <div
          class="grid grid-cols-[minmax(0,1fr)_13%_18%_16%] px-0 pb-5 text-[13px] font-normal sm:text-[15px] lg:grid-cols-[minmax(220px,1fr)_150px_170px_150px] lg:text-[16px]"
        >
          <span>Product</span><span>Price</span><span>Quantity</span
          ><span>Subtotal</span>
        </div>
        <div
          class="grid grid-cols-[minmax(0,1fr)_13%_18%_16%] items-center border-b border-[#edf0f2] py-7 lg:grid-cols-[minmax(220px,1fr)_150px_170px_150px]"
        >
          <div class="flex items-center gap-3">
            <div
              class="relative flex h-12 w-12 items-center justify-center rounded bg-[#f3f3f3]"
            >
              <img
                src="image/king.png"
                alt="LCD "
                class="h-full w-full object-contain"
              /><button
                type="button"
                class="absolute -left-2 -top-2 flex h-4 w-4 items-center justify-center rounded-full bg-[#ff2d3d] text-[12px] text-white"
              >
                ×
              </button>
            </div>
            <span class="text-[13px] sm:text-[15px] lg:text-[16px]"
              >LCD Monitor</span
            >
          </div>
          <span class="text-[13px] sm:text-[14px] lg:text-[15px]">$650</span>
          <div
            class="flex h-[42px] w-full items-center justify-between rounded border border-[#9aaabd] text-[13px] lg:w-20 lg:text-[15px]"
          >
            <span class="pl-2 lg:pl-3">01</span
            ><span class="flex h-full flex-col border-l border-[#cbd5e1]"
              ><button
                type="button"
                class="h-1/2 px-1 text-[11px] hover:bg-[#f1f3f5] lg:px-2"
              >
                ⌃</button
              ><button
                type="button"
                class="h-1/2 border-t border-[#cbd5e1] px-1 text-[11px] leading-none hover:bg-[#f1f3f5] lg:px-2"
              >
                ⌄
              </button></span
            >
          </div>
          <span class="text-[13px] sm:text-[14px] lg:text-[15px]">$650</span>
        </div>
        <div
          class="grid grid-cols-[minmax(0,1fr)_13%_18%_16%] items-center border-b border-[#edf0f2] py-7 lg:grid-cols-[minmax(220px,1fr)_150px_170px_150px]"
        >
          <div class="flex items-center gap-3">
            <div
              class="relative flex h-12 w-12 items-center justify-center rounded bg-[#f3f3f3]"
            >
              <img
                src="image/game.png"
                alt="H1 Gamepad"
                class="h-full w-full object-contain"
              /><button
                type="button"
                class="absolute -left-2 -top-2 flex h-4 w-4 items-center justify-center rounded-full bg-[#ff2d3d] text-[12px] leading-none text-white"
              >
                ×
              </button>
            </div>
            <span class="text-[13px] sm:text-[15px] lg:text-[16px]"
              >H1 Gamepad</span
            >
          </div>
          <span class="text-[13px] sm:text-[14px] lg:text-[15px]">$550</span>
          <div
            class="flex h-[42px] w-full items-center justify-between rounded border border-[#9aaabd] text-[13px] lg:w-20 lg:text-[15px]"
          >
            <span class="pl-2 lg:pl-3">02</span
            ><span class="flex h-full flex-col border-l border-[#cbd5e1]"
              ><button
                type="button"
                class="h-1/2 px-1 text-[11px] leading-none hover:bg-[#f1f3f5] lg:px-2"
              >
                ⌃</button
              ><button
                type="button"
                class="h-1/2 border-t border-[#cbd5e1] px-1 text-[11px] hover:bg-[#f1f3f5] lg:px-2"
              >
                ⌄
              </button></span
            >
          </div>
          <span class="text-[13px] sm:text-[14px] lg:text-[15px]">$1100</span>
        </div>
        <div
          class="flex flex-col justify-between gap-8 py-8 sm:flex-row sm:items-center"
        >
          <button
            type="button"
            class="rounded border border-[#9aaabd] px-6 py-4 text-[16px] font-bold text-[#000000] transition hover:bg-[#183653] hover:text-white"
          >
            Return To Shop</button
          ><button
            type="button"
            class="rounded border border-[#9aaabd] px-6 py-4 text-[16px] text-[#000000] transition hover:bg-[#f6f8fa]"
          >
            Update Cart
          </button>
        </div>
        <div class="grid items-start gap-10 lg:grid-cols-[1fr_496px]">
          <div class="flex w-full max-w-[365px]">
            <input
              type="text"
              placeholder="Coupon Code"
              class="h-[50px] min-w-0 flex-1 rounded-l border border-[#9aaabd] px-4 text-[14px] outline-none placeholder:text-[#8694a4] focus:border-[#183653]"
            /><button
              type="button"
              class="h-[50px] rounded-r bg-[#DB4444] px-6 text-[14px] text-white transition hover:bg-[#e52232]"
            >
              Apply Coupon
            </button>
          </div>
          <div class="rounded-lg border border-[#9aaabd] p-6 sm:p-8">
            <h2
              class="mb-6 font-['Space_Grotesk'] text-[18px] font-bold text-[#111827]"
            >
              Cart Total
            </h2>
            <div class="text-[15px]">
              <div class="flex justify-between border-b border-[#000000] pb-4">
                <span>Subtotal:</span><span>$1750</span>
              </div>
              <div class="flex justify-between border-b border-[#000000] py-4">
                <span>Shipping:</span><span>Free</span>
              </div>
              <div class="flex justify-between pt-7 font-bold text-[#111827]">
                <span>Total:</span><span>$1750</span>
              </div>
            </div>
            <button
              type="button"
              class="mt-7 w-full rounded bg-[#DB4444] py-4 text-[14px] text-white transition hover:bg-[#e52232]"
            >
              Process to checkout
            </button>
          </div>
        </div>
      </section>
    </main>

    <!-- abdullah -->
    <div id="footer"></div>

    <script>
      fetch("../Abdullah/header.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("header").innerHTML = data;
        })
        .catch((error) => console.error("Error loading header:", error));

      fetch("../Abdullah/footer.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("footer").innerHTML = data.replaceAll(
            "./assets/",
            "../Abdullah/assets/",
          );
        })
        .catch((error) => console.error("Error loading footer:", error));
    </script>
  </body>
</html>
