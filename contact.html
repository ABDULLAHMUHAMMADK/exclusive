<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Contact</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
     <!-- <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
            },
            colors: { brand: "#DB4444" },
          },
        },
      };
    </script> -->

    <style>
            * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: sans-serif;
    }


    </style>
  </head>

  <body >
    <div id="header"></div>

    <main class="w-full ">
      <section
        class="w-full px-6 sm:px-8 lg:px-0 pt-12 sm:pt-14 lg:pt-[55px] pb-8 "
      >
        <div class="flex items-center px-20 gap-3 text-[13px]">
          <a href="./index.html " class="text-[#7D8184] hover:text-black transition">
            Home
          </a>

          <span class="text-[#7D8184]"> / </span>

          <span class="text-[#000000]"> Contact </span>
        </div>
      </section>


      <section
        class="max-w-7xl mx-auto px-6 sm:px-8 lg:px-0 pb-16 lg:pb-[80px]"
      >
        <div
          class="flex flex-col lg:flex-row gap-6 lg:gap-[20px] items-stretch"
        >

          <div
            class="w-full lg:w-[31%]  lg:h-[340px] bg-white shadow-[0_2px_15px_rgba(0,0,0,0.04)]  sm:px-8 py-8"
          >

            <div class=" px-11 " >
              <div class="flex items-center gap-3 mb-5">
                <div
                  class="w-[30px] h-[30px] rounded-full bg-[#DB4444]  flex items-center justify-center text-white"
                >
                  <i class="fa-solid fa-phone text-[13px]"></i>
                </div>

                <h2 class="text-[15px] font-medium text-black">Call To Us</h2>
              </div>

              <p class="text-[12px] leading-5 text-[#111111] mb-3">
                We are available 24/7, 7 days a week.
              </p>

              <p class="text-[12px] text-[#111111]">Phone: +880161112222</p>
            </div>


            <div class="w-full h-[1px] bg-[#AFAFAF] my-6"></div>


            <div class=" px-11">
              <div class="flex items-center gap-3 mb-5">
                <!-- Email Icon -->
                <div
                  class="w-[30px] h-[30px] rounded-full bg-[#DB4444] flex items-center justify-center text-white"
                >
                  <i class="fa-regular fa-envelope text-[14px]"></i>
                </div>

                <h2 class="text-[15px] font-medium text-black">Write To Us</h2>
              </div>

              <p class="text-[12px] leading-5 text-[#111111] mb-3">
                Fill out our form and we will contact you within 24 hours.
              </p>

              <p class="text-[12px] text-[#111111] mb-3">
                Emails: customer@exclusive.com
              </p>

              <p class="text-[12px] text-[#111111]">
                Emails: support@exclusive.com
              </p>
            </div>
          </div>


          <div
            class="w-full lg:w-[69%]  px-6 sm:px-7 lg:px-[23px] py-7 sm:py-8"
          >
            <form>

              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <input
                  type="text"
                  placeholder="Your Name *"
                  required
                  class="w-full h-[37px] bg-[#F5F5F5] border-none outline-none px-3 text-[12px] text-black placeholder:text-[#8B8B8B] focus:ring-1 focus:ring-[#DB4444]"
                />

                <input
                  type="email"
                  placeholder="Your Email *"
                  required
                  class="w-full h-[37px] bg-[#F5F5F5] border-none outline-none px-3 text-[12px] text-black placeholder:text-[#8B8B8B] focus:ring-1 focus:ring-[#DB4444]"
                />

                <input
                  type="tel"
                  placeholder="Your Phone *"
                  required
                  class="w-full h-[37px] bg-[#F5F5F5] border-none outline-none px-3 text-[12px] text-black placeholder:text-[#8B8B8B] focus:ring-1 focus:ring-[#DB4444]"
                />
              </div>


              <textarea
                rows="8"
                placeholder="Your Message"
                class="w-full h-[155px] sm:h-[160px] mt-6 bg-[#F5F5F5] border-none outline-none resize-none px-3 py-3 text-[12px] text-black placeholder:text-[#8B8B8B] focus:ring-1 focus:ring-[#DB4444]"
              ></textarea>


              <div class="flex justify-end mt-6">
                <button
                  type="submit"
                  class="w-full sm:w-[160px] h-[42px] bg-[#DB4444] hover:bg-[#c93636] text-white text-[12px] font-medium rounded-[3px] transition"
                >
                  Send Message
                </button>
              </div>
            </form>
          </div>
        </div>
      </section>
    </main>

    <div id="footer"></div>

    <script>
      fetch("header.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("header").innerHTML = data;
        })
        .catch((error) => console.error("Error loading header:", error));

      fetch("footer.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("footer").innerHTML = data;
        })
        .catch((error) => console.error("Error loading footer:", error));

      const menuButton = document.getElementById("menuButton");
      const mobileMenu = document.getElementById("mobileMenu");
      const menuIcon = document.getElementById("menuIcon");

      menuButton.addEventListener("click", () => {
        mobileMenu.classList.toggle("hidden");

        if (mobileMenu.classList.contains("hidden")) {
          menuIcon.classList.remove("fa-xmark");
          menuIcon.classList.add("fa-bars");
        } else {
          menuIcon.classList.remove("fa-bars");
          menuIcon.classList.add("fa-xmark");
        }
      });

      function initializeMenu() {
        const menuButton = document.getElementById("menuButton");
        const mobileMenu = document.getElementById("mobileMenu");
        const menuIcon = document.getElementById("menuIcon");

        // Only run if elements exist
        if (menuButton && mobileMenu && menuIcon) {
          menuButton.addEventListener("click", () => {
            mobileMenu.classList.toggle("hidden");

            if (mobileMenu.classList.contains("hidden")) {
              menuIcon.classList.remove("fa-xmark");
              menuIcon.classList.add("fa-bars");
            } else {
              menuIcon.classList.remove("fa-bars");
              menuIcon.classList.add("fa-xmark");
            }
          });
        }
      }
    </script>
  </body>
</html>
